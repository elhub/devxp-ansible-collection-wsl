---
- name: venv
  ansible.builtin.apt:
    name: python3-venv
  become: true

- name: Ensure apt keyrings dir exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Download deadsnakes ppa signing key
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF23C5A6CF475977595C89F51BA6932366A755776"
    dest: /etc/apt/keyrings/deadsnakes-ppa.asc
    mode: "0644"
  become: true

- name: add deadsnakes ppa
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/deadsnakes-ppa.asc] https://ppa.launchpadcontent.net/deadsnakes/ppa/ubuntu {{ ansible_distribution_release }} main"
    filename: deadsnakes-ppa
    state: present
    update_cache: true
  become: true

- name: additional python versions
  ansible.builtin.apt:
    name:
      - python{{ item }}
      - python{{ item }}-venv
      - python{{ item }}-dev
    update_cache: true
  loop:
    - "3.13" # Latest stable
    # 3.12 is standard python3 on Ubuntu 24.04
    - "3.9" # Default on Oracle Linux 9
    - "3.8" # Latest available in software collection on Oracle Linux 7
  become: true

- name: dependencies for installing from source
  ansible.builtin.apt:
    name:
      - build-essential
      - clang
      - libbz2-dev
      - libffi-dev
      - libgdbm-dev
      - liblzma-dev
      - libncurses5-dev
      - libncursesw5-dev
      - libnss3-dev
      - libreadline-dev
      - libsqlite3-dev
      - libssl-dev
      - llvm
      - llvm-dev
      - tk-dev
      - xz-utils
      - zlib1g-dev
  become: true

- name: ensure directory for python src files
  ansible.builtin.file:
    state: directory
    path: "{{ ansible_facts['env']['HOME'] }}/.local/src/python"

- name: install from source
  include_tasks: install-from-source.yml
  loop_control:
    loop_var: _python_source_version
  loop:
    - "3.6.8" # Default on Oracle Linux 7

- name: add lib dir to LD_LIBRARY_PATH
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.shrc.d/50-python.sh"
    mode: 0644
    content: |
      # Managed by Ansible - elhub.wsl.python
      if [ -d "$HOME/.local/bin" ] ; then
        export LD_LIBRARY_PATH="{{ ansible_facts['env']['HOME'] }}/.local/lib:$LD_LIBRARY_PATH"
      fi
